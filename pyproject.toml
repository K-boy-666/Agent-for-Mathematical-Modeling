[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "math-modeling-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "mcp>=1.27,<2",
    "pydantic>=2.13,<3",
    "rfc8785==0.1.4",
    "scipy>=1.17.1",
]

[project.scripts]
modeling = "modeling_cli.main:main"
modeling-mcp = "modeling_mcp.__main__:main"

[dependency-groups]
dev = [
    "editables~=0.3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "scipy-stubs>=1.17.1.5",
]

[tool.uv]
required-version = "==0.11.28"
package = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml", "src", "tests"]
exclude = ["spikes"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/modeling_cli",
    "src/modeling_capabilities",
    "src/modeling_core",
    "src/modeling_harness",
    "src/modeling_infrastructure",
    "src/modeling_bootstrap",
    "src/modeling_mcp",
]
exclude = ["spikes"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_only: requires the supported Windows diagnostic adapter",
    "cross_platform: keeps a platform boundary test collected on every host",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
platform = "win32"
strict = true
files = ["src"]
