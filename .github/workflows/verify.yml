name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1b:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        id: setup-uv
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked --group dev
      - name: Diagnose first integration failure
        run: uv run --locked --no-sync pytest tests/integration -x -vv --tb=short
        env:
          UV: ${{ steps.setup-uv.outputs.uv-path }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1b-${{ runner.os }}-${{ github.sha }}
          path: build/verification/m1b/
          if-no-files-found: error
